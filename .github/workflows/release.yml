name: Release

on:
  push:
    tags:
      - 'mc*-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CURSEFORGE_BASE_URL: https://minecraft.curseforge.com

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Verify Gradle wrapper integrity metadata
        shell: bash
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties

      - name: Read project metadata
        id: vars
        shell: bash
        run: |
          mod_version=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')
          artifact_base=$(grep -E '^artifact_base_name=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')
          mod_name=$(grep -E '^mod_name=' gradle.properties | cut -d'=' -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          modrinth_project_id=$(grep -E '^modrinth_project_id=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')
          tiktoklive_version=$(grep -E '^tiktoklive_version=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')
          mc_version=$(grep -E "^[[:space:]]*minecraftVersion[[:space:]]*=" build.gradle | head -n1 | sed -E "s/.*'([^']+)'.*/\1/")
          required_vars=(mod_version artifact_base mod_name modrinth_project_id tiktoklive_version mc_version)
          for required_var in "${required_vars[@]}"; do
            if [ -z "${!required_var}" ]; then
              echo "::error::Required release metadata '${required_var}' resolved to an empty value."
              exit 1
            fi
          done
          prerelease=false
          modrinth_version_type=release
          curseforge_release_type=release
          if echo "$mod_version" | grep -iqE -- '-alpha(\.[0-9]+)?$|-snapshot$'; then
            prerelease=true
            modrinth_version_type=alpha
            curseforge_release_type=alpha
          elif echo "$mod_version" | grep -iqE -- '-(beta|rc)(\.[0-9]+)?$|-pre$'; then
            prerelease=true
            modrinth_version_type=beta
            curseforge_release_type=beta
          fi
          {
            echo "mod_version=${mod_version}"
            echo "artifact_base=${artifact_base}"
            echo "mod_name=${mod_name}"
            echo "modrinth_project_id=${modrinth_project_id}"
            echo "tiktoklive_version=${tiktoklive_version}"
            echo "mc_version=${mc_version}"
            echo "expected_tag=mc${mc_version}-v${mod_version}"
            echo "mod_jar=${artifact_base}-${mc_version}-${mod_version}.jar"
            echo "prerelease=${prerelease}"
            echo "modrinth_version_type=${modrinth_version_type}"
            echo "curseforge_release_type=${curseforge_release_type}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: artifact_base=${artifact_base} mod_version=${mod_version} mc_version=${mc_version} tiktoklive=${tiktoklive_version} modrinth=${modrinth_project_id} prerelease=${prerelease} modrinth_type=${modrinth_version_type} curseforge_type=${curseforge_release_type}"

      - name: Verify tag matches branch metadata
        if: startsWith(github.ref, 'refs/tags/mc')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="${{ steps.vars.outputs.expected_tag }}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Tag '$tag' does not match expected '$expected'."
            echo "::error::Format is 'mc<minecraftVersion>-v<mod_version>'; check build.gradle minecraftVersion and gradle.properties mod_version match the tag."
            exit 1
          fi

      - name: Verify Modrinth publishing credentials
        if: startsWith(github.ref, 'refs/tags/mc')
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "${MODRINTH_TOKEN}" ]; then
            echo "::error::MODRINTH_TOKEN is not configured. Add the repository secret before publishing tagged releases."
            exit 1
          fi

      - name: Verify CurseForge publishing configuration
        if: startsWith(github.ref, 'refs/tags/mc')
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
          CURSEFORGE_MANUAL_RELEASE: ${{ vars.CURSEFORGE_MANUAL_RELEASE }}
        run: |
          if [ -z "${CURSEFORGE_API_TOKEN}" ]; then
            echo "::error::CURSEFORGE_API_TOKEN is not configured. Add the repository secret before publishing tagged releases."
            exit 1
          fi

          if [ -z "${CURSEFORGE_PROJECT_ID}" ]; then
            echo "::error::CURSEFORGE_PROJECT_ID is not configured. Add the repository variable before publishing tagged releases."
            exit 1
          fi

          if ! [[ "${CURSEFORGE_PROJECT_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::CURSEFORGE_PROJECT_ID must be a numeric project id."
            exit 1
          fi

          if [ -z "${CURSEFORGE_GAME_VERSIONS}" ]; then
            echo "::error::CURSEFORGE_GAME_VERSIONS is not configured. Add a comma-separated list of numeric game version ids."
            exit 1
          fi

          IFS=',' read -ra version_ids <<< "${CURSEFORGE_GAME_VERSIONS}"
          valid_count=0
          for raw_id in "${version_ids[@]}"; do
            id="$(echo "${raw_id}" | tr -d '[:space:]')"
            if [ -z "${id}" ]; then
              continue
            fi
            if ! [[ "${id}" =~ ^[0-9]+$ ]]; then
              echo "::error::CURSEFORGE_GAME_VERSIONS must be a comma-separated list of numeric ids. Invalid value: '${raw_id}'."
              exit 1
            fi
            valid_count=$((valid_count + 1))
          done

          if [ "${valid_count}" -eq 0 ]; then
            echo "::error::CURSEFORGE_GAME_VERSIONS resolved to zero usable ids."
            exit 1
          fi

          manual_release="${CURSEFORGE_MANUAL_RELEASE:-false}"
          echo "Resolved CurseForge config: project=${CURSEFORGE_PROJECT_ID}, game_versions=${CURSEFORGE_GAME_VERSIONS}, manual_release=${manual_release}"

      - name: Verify CHANGELOG entry for release
        if: startsWith(github.ref, 'refs/tags/mc')
        shell: bash
        run: |
          version="${{ steps.vars.outputs.mod_version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing at repo root."
            exit 1
          fi
          if ! awk -v ver="$version" '
            /^##[[:space:]]+/ {
              line = $0
              sub(/^##[[:space:]]+/, "", line)
              sub(/^\[/, "", line)
              n = index(line, "]")
              if (n > 0) {
                line = substr(line, 1, n - 1)
              } else if (match(line, /[[:space:]]/) > 0) {
                line = substr(line, 1, RSTART - 1)
              }
              if (line == ver) { found = 1; exit }
            }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${version}' (or '## [${version}]') section. Add a release note before tagging."
            exit 1
          fi

          awk -v ver="$version" '
            /^##[[:space:]]+/ {
              line = $0
              sub(/^##[[:space:]]+/, "", line)
              sub(/^\[/, "", line)
              n = index(line, "]")
              if (n > 0) {
                line = substr(line, 1, n - 1)
              } else if (match(line, /[[:space:]]/) > 0) {
                line = substr(line, 1, RSTART - 1)
              }
              if (found) { exit }
              if (line == ver) { found = 1; next }
            }
            found { print }
            END { exit !found }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md section for '${version}' is empty."
            exit 1
          fi

      - name: Cache TikTokLiveJava jar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: libs
          key: tiktoklive-${{ steps.vars.outputs.tiktoklive_version }}
          restore-keys: |
            tiktoklive-

      - name: Build, lint, test, and bundle
        run: ./gradlew --no-daemon --stacktrace clean check build prismBundle verifyPrismMetadata modrinthPack verifyModrinthPack

      - name: Package Packwiz client bundle zip
        id: packwiz
        shell: bash
        run: |
          bundle_zip="${{ steps.vars.outputs.artifact_base }}-${{ steps.vars.outputs.mc_version }}-${{ steps.vars.outputs.mod_version }}-packwiz.zip"
          (cd build/prism-bundle && zip -r "../../${bundle_zip}" .)
          echo "bundle_zip=${bundle_zip}" >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp build/libs/*.jar release-assets/
          cp "${{ steps.packwiz.outputs.bundle_zip }}" release-assets/
          cp build/distributions/*.mrpack release-assets/
          ls -la release-assets/

      - name: Generate checksums
        shell: bash
        working-directory: release-assets
        run: |
          files=$(find . -maxdepth 1 -type f ! -name 'SHA*SUMS.txt' ! -name 'curseforge-publish.json' -printf '%f\n' | sort)
          if [ -z "$files" ]; then
            echo "::error::No assets staged for checksum generation."
            exit 1
          fi
          echo "$files" | xargs -d '\n' sha256sum > SHA256SUMS.txt
          echo "$files" | xargs -d '\n' sha512sum > SHA512SUMS.txt
          cat SHA256SUMS.txt

      - name: Compute primary artifact digest
        id: digests
        shell: bash
        run: |
          jar_path="build/libs/${{ steps.vars.outputs.mod_jar }}"
          if [ ! -f "${jar_path}" ]; then
            echo "::error::Expected built jar '${jar_path}' was not found."
            exit 1
          fi

          jar_sha256=$(sha256sum "${jar_path}" | cut -d' ' -f1)
          {
            echo "jar_path=${jar_path}"
            echo "jar_sha256=${jar_sha256}"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub Release exists
        id: github_release
        if: startsWith(github.ref, 'refs/tags/mc')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ steps.vars.outputs.artifact_base }} v${{ steps.vars.outputs.mod_version }} (MC ${{ steps.vars.outputs.mc_version }})
          PRERELEASE: ${{ steps.vars.outputs.prerelease }}
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          http_code=$(curl --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o gh-release.json \
            -w '%{http_code}' \
            "${api_url}")

          if [ "${http_code}" = "404" ]; then
            python - <<'PY'
          import json
          import os

          prerelease = os.environ["PRERELEASE"].strip().lower() == "true"
          with open("release-notes.md", "r", encoding="utf-8") as fh:
              body = fh.read()

          payload = {
              "tag_name": os.environ["GITHUB_REF_NAME"],
              "name": os.environ["RELEASE_NAME"],
              "body": body,
              "draft": False,
              "prerelease": prerelease,
          }

          with open("gh-release-request.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh)
          PY

            create_code=$(curl --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @gh-release-request.json \
              -o gh-release.json \
              -w '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")

            if [ "${create_code}" -lt 200 ] || [ "${create_code}" -ge 300 ]; then
              echo "::error::Failed to create GitHub release for tag '${GITHUB_REF_NAME}' (HTTP ${create_code})."
              cat gh-release.json
              exit 1
            fi
          elif [ "${http_code}" != "200" ]; then
            echo "::error::Failed to query GitHub release for tag '${GITHUB_REF_NAME}' (HTTP ${http_code})."
            cat gh-release.json
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import sys

          with open("gh-release.json", "r", encoding="utf-8") as fh:
              release = json.load(fh)

          release_id = release.get("id")
          upload_url = str(release.get("upload_url", "")).split("{", 1)[0]
          if not release_id or not upload_url:
              print("::error::GitHub release response did not include id and upload_url.")
              print(json.dumps(release, indent=2))
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"release_id={release_id}\n")
              fh.write(f"upload_url={upload_url}\n")
          PY

      - name: Detect existing CurseForge publish marker
        id: cf_marker
        if: startsWith(github.ref, 'refs/tags/mc')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          EXPECTED_SHA256: ${{ steps.digests.outputs.jar_sha256 }}
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          http_code=$(curl --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o gh-release.json \
            -w '%{http_code}' \
            "${api_url}")

          export GH_RELEASE_HTTP_CODE="${http_code}"

          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          out = os.environ["GITHUB_OUTPUT"]
          status = os.environ["GH_RELEASE_HTTP_CODE"]
          tag = os.environ["GITHUB_REF_NAME"]
          token = os.environ["GITHUB_TOKEN"]
          expected_project = str(os.environ["CURSEFORGE_PROJECT_ID"])
          expected_sha = os.environ["EXPECTED_SHA256"]

          def write_output(key, value):
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"{key}={value}\n")

          if status == "404":
              write_output("skip", "false")
              write_output("existing_file_id", "")
              sys.exit(0)

          if status != "200":
              print(f"::error::Failed to query GitHub release for tag '{tag}' (HTTP {status}).")
              try:
                  print(open("gh-release.json", "r", encoding="utf-8").read())
              except FileNotFoundError:
                  pass
              sys.exit(1)

          with open("gh-release.json", "r", encoding="utf-8") as fh:
              release = json.load(fh)

          assets = release.get("assets", [])
          marker = next((asset for asset in assets if asset.get("name") == "curseforge-publish.json"), None)
          started_marker = next((asset for asset in assets if asset.get("name") == "curseforge-upload-started.json"), None)

          if marker is None and started_marker is not None:
              print("::error::A previous run marked the CurseForge upload as started but did not publish the final marker.")
              print("::error::Inspect CurseForge manually before rerunning to avoid uploading the same jar twice.")
              sys.exit(1)

          if marker is None:
              if assets:
                  asset_names = sorted(str(asset.get("name", "")) for asset in assets)
                  print("::error::A GitHub release already has assets for this tag, but it has no curseforge-publish.json marker.")
                  print("::error::Refusing to upload to CurseForge because the previous publish state is ambiguous.")
                  print(json.dumps({"assets": asset_names}, indent=2))
                  sys.exit(1)
              write_output("skip", "false")
              write_output("existing_file_id", "")
              sys.exit(0)

          marker_url = marker.get("url")
          if not marker_url:
              print("::error::CurseForge marker asset exists but has no API URL.")
              sys.exit(1)

          request = urllib.request.Request(
              marker_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/octet-stream",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          os.makedirs("release-assets", exist_ok=True)
          with urllib.request.urlopen(request) as response:
              payload = response.read()

          marker_path = os.path.join("release-assets", "curseforge-publish.json")
          with open(marker_path, "wb") as fh:
              fh.write(payload)

          marker_data = json.loads(payload.decode("utf-8"))
          marker_project = str(marker_data.get("project_id", ""))
          marker_sha = str(marker_data.get("artifact_sha256", ""))
          marker_tag = str(marker_data.get("tag", ""))

          if marker_tag != tag or marker_project != expected_project or marker_sha != expected_sha:
              print("::error::CurseForge marker does not match the current tag/project/hash tuple.")
              print(json.dumps(marker_data, indent=2))
              sys.exit(1)

          write_output("skip", "true")
          write_output("existing_file_id", str(marker_data.get("file_id", "")))
          PY

      - name: Mark CurseForge upload as started
        id: cf_started
        if: startsWith(github.ref, 'refs/tags/mc') && steps.cf_marker.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_UPLOAD_URL: ${{ steps.github_release.outputs.upload_url }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MOD_JAR: ${{ steps.vars.outputs.mod_jar }}
          ARTIFACT_SHA256: ${{ steps.digests.outputs.jar_sha256 }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime
          import json
          import os

          marker = {
              "tag": os.environ["GITHUB_REF_NAME"],
              "project_id": os.environ["CURSEFORGE_PROJECT_ID"],
              "artifact_name": os.environ["MOD_JAR"],
              "artifact_sha256": os.environ["ARTIFACT_SHA256"],
              "status": "upload_started",
              "started_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }

          with open("curseforge-upload-started.json", "w", encoding="utf-8") as fh:
              json.dump(marker, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY

          marker_name=$(python - <<'PY'
          import urllib.parse

          print(urllib.parse.quote("curseforge-upload-started.json", safe=""))
          PY
          )

          http_code=$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @curseforge-upload-started.json \
            -o gh-started-marker-upload.json \
            -w '%{http_code}' \
            "${RELEASE_UPLOAD_URL}?name=${marker_name}")

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Failed to upload CurseForge started marker to GitHub Release (HTTP ${http_code})."
            cat gh-started-marker-upload.json
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import sys

          with open("gh-started-marker-upload.json", "r", encoding="utf-8") as fh:
              response = json.load(fh)

          asset_id = response.get("id")
          if not asset_id:
              print("::error::GitHub did not return an asset id for the CurseForge started marker.")
              print(json.dumps(response, indent=2))
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"asset_id={asset_id}\n")
          PY

      - name: Publish to CurseForge
        id: curseforge
        if: startsWith(github.ref, 'refs/tags/mc') && steps.cf_marker.outputs.skip != 'true'
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
          CURSEFORGE_MANUAL_RELEASE: ${{ vars.CURSEFORGE_MANUAL_RELEASE }}
          CURSEFORGE_RELEASE_TYPE: ${{ steps.vars.outputs.curseforge_release_type }}
          MOD_NAME: ${{ steps.vars.outputs.mod_name }}
          MOD_VERSION: ${{ steps.vars.outputs.mod_version }}
          MC_VERSION: ${{ steps.vars.outputs.mc_version }}
          MOD_JAR: ${{ steps.vars.outputs.mod_jar }}
          ARTIFACT_SHA256: ${{ steps.digests.outputs.jar_sha256 }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os

          versions = [int(value.strip()) for value in os.environ["CURSEFORGE_GAME_VERSIONS"].split(",") if value.strip()]
          metadata = {
              "changelog": open("release-notes.md", "r", encoding="utf-8").read().strip(),
              "changelogType": "markdown",
              "displayName": f"{os.environ['MOD_NAME']} v{os.environ['MOD_VERSION']} (MC {os.environ['MC_VERSION']})",
              "gameVersions": versions,
              "releaseType": os.environ["CURSEFORGE_RELEASE_TYPE"],
          }

          manual_release = os.environ.get("CURSEFORGE_MANUAL_RELEASE", "").strip().lower()
          if manual_release in {"1", "true", "yes", "on"}:
              metadata["isMarkedForManualRelease"] = True

          with open("cf-metadata.json", "w", encoding="utf-8") as fh:
              json.dump(metadata, fh, ensure_ascii=False)
          PY

          upload_url="${CURSEFORGE_BASE_URL}/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file"
          curl_exit=0
          http_code=$(curl --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -H "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            -F "metadata=<cf-metadata.json;type=application/json" \
            -F "file=@build/libs/${MOD_JAR};type=application/java-archive" \
            -o cf-response.json \
            -w '%{http_code}' \
            "${upload_url}") || curl_exit=$?

          if [ "${curl_exit}" -ne 0 ]; then
            echo "::error::Network or transport failure while uploading to CurseForge."
            test -f cf-response.json && cat cf-response.json
            exit "${curl_exit}"
          fi

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::CurseForge upload failed with HTTP ${http_code}."
            cat cf-response.json
            exit 1
          fi

          python - <<'PY'
          import datetime
          import json
          import os
          import sys

          with open("cf-response.json", "r", encoding="utf-8") as fh:
              response = json.load(fh)

          file_id = response.get("id")
          if not isinstance(file_id, int):
              print("::error::CurseForge response did not contain an integer file id.")
              print(json.dumps(response, indent=2))
              sys.exit(1)

          manual_release = os.environ.get("CURSEFORGE_MANUAL_RELEASE", "").strip().lower() in {"1", "true", "yes", "on"}
          marker = {
              "tag": os.environ["GITHUB_REF_NAME"],
              "project_id": os.environ["CURSEFORGE_PROJECT_ID"],
              "file_id": file_id,
              "artifact_name": os.environ["MOD_JAR"],
              "artifact_sha256": os.environ["ARTIFACT_SHA256"],
              "display_name": f"{os.environ['MOD_NAME']} v{os.environ['MOD_VERSION']} (MC {os.environ['MC_VERSION']})",
              "release_type": os.environ["CURSEFORGE_RELEASE_TYPE"],
              "manual_release": manual_release,
              "uploaded_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }

          os.makedirs("release-assets", exist_ok=True)
          with open("release-assets/curseforge-publish.json", "w", encoding="utf-8") as fh:
              json.dump(marker, fh, indent=2, ensure_ascii=False)
              fh.write("\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"file_id={file_id}\n")
          PY

      - name: Upload CurseForge publish marker
        if: startsWith(github.ref, 'refs/tags/mc') && steps.cf_marker.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_UPLOAD_URL: ${{ steps.github_release.outputs.upload_url }}
        run: |
          set -euo pipefail

          marker_path="release-assets/curseforge-publish.json"
          test -f "${marker_path}"

          marker_name=$(python - <<'PY'
          import urllib.parse

          print(urllib.parse.quote("curseforge-publish.json", safe=""))
          PY
          )

          http_code=$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @"${marker_path}" \
            -o gh-marker-upload.json \
            -w '%{http_code}' \
            "${RELEASE_UPLOAD_URL}?name=${marker_name}")

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Failed to upload CurseForge marker to GitHub Release (HTTP ${http_code})."
            cat gh-marker-upload.json
            exit 1
          fi

      - name: Remove CurseForge started marker
        if: startsWith(github.ref, 'refs/tags/mc') && steps.cf_marker.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARTED_MARKER_ASSET_ID: ${{ steps.cf_started.outputs.asset_id }}
        run: |
          set -euo pipefail

          if [ -z "${STARTED_MARKER_ASSET_ID}" ]; then
            echo "::error::Missing started marker asset id."
            exit 1
          fi

          http_code=$(curl --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o gh-started-marker-delete.json \
            -w '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${STARTED_MARKER_ASSET_ID}")

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::warning::Failed to remove CurseForge started marker from GitHub Release (HTTP ${http_code})."
            cat gh-started-marker-delete.json
          fi

      - name: Reuse existing CurseForge marker
        if: startsWith(github.ref, 'refs/tags/mc') && steps.cf_marker.outputs.skip == 'true'
        shell: bash
        run: |
          test -f release-assets/curseforge-publish.json
          echo "CurseForge upload skipped; existing file id: ${{ steps.cf_marker.outputs.existing_file_id }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.vars.outputs.artifact_base }}-${{ steps.vars.outputs.mc_version }}-${{ steps.vars.outputs.mod_version }}
          path: release-assets/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/mc')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ steps.vars.outputs.artifact_base }} v${{ steps.vars.outputs.mod_version }} (MC ${{ steps.vars.outputs.mc_version }})
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout MC-Publish
        if: startsWith(github.ref, 'refs/tags/mc')
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Kira-NT/mc-publish
          ref: 995edadc13559a8b28d0b7e6571229f067ec7659
          path: .github/actions/mc-publish
          persist-credentials: false

      - name: Patch MC-Publish runtime metadata
        if: startsWith(github.ref, 'refs/tags/mc')
        shell: bash
        run: |
          actual_ref="$(git -C .github/actions/mc-publish rev-parse HEAD)"
          if [ "${actual_ref}" != "995edadc13559a8b28d0b7e6571229f067ec7659" ]; then
            echo "::error::MC-Publish checkout resolved to '${actual_ref}', expected '995edadc13559a8b28d0b7e6571229f067ec7659'."
            exit 1
          fi
          sed -i 's/using: node16/using: node24/' .github/actions/mc-publish/action.yml
          grep -q 'using: node24' .github/actions/mc-publish/action.yml

      - name: Publish to Modrinth
        if: startsWith(github.ref, 'refs/tags/mc')
        uses: ./.github/actions/mc-publish
        with:
          modrinth-id: ${{ steps.vars.outputs.modrinth_project_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: build/libs/${{ steps.vars.outputs.mod_jar }}
          modrinth-featured: ${{ steps.vars.outputs.modrinth_version_type == 'release' }}
          name: ${{ steps.vars.outputs.mod_name }} v${{ steps.vars.outputs.mod_version }} (MC ${{ steps.vars.outputs.mc_version }})
          version: ${{ github.ref_name }}
          version-type: ${{ steps.vars.outputs.modrinth_version_type }}
          changelog-file: release-notes.md
          loaders: |
            forge
          game-versions: |
            ${{ steps.vars.outputs.mc_version }}
          java: |
            17
