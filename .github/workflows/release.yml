name: Release

on:
  push:
    tags:
      - 'mc*-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Gradle wrapper version
        id: gradle_wrapper
        shell: bash
        run: |
          version=$(sed -nE 's@^distributionUrl=.*/gradle-([0-9.]+)-bin\.zip$@\1@p' gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$version" ]; then
            echo "::error::Could not parse Gradle version from gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Gradle wrapper version: ${version}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: ${{ steps.gradle_wrapper.outputs.version }}

      - name: Materialize Gradle wrapper jar
        shell: bash
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --no-daemon
            git checkout -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties
          fi
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Read project metadata
        id: vars
        shell: bash
        run: |
          mod_version=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')
          artifact_base=$(grep -E '^artifact_base_name=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')
          tiktoklive_version=$(grep -E '^tiktoklive_version=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')
          mc_version=$(grep -E "^\s*minecraftVersion\s*=" build.gradle | head -n1 | sed -E "s/.*'([^']+)'.*/\1/")
          prerelease=false
          if echo "$mod_version" | grep -iqE -- '-(alpha|beta|rc)(\.[0-9]+)?$|-(pre|snapshot)$'; then
            prerelease=true
          fi
          {
            echo "mod_version=${mod_version}"
            echo "artifact_base=${artifact_base}"
            echo "tiktoklive_version=${tiktoklive_version}"
            echo "mc_version=${mc_version}"
            echo "expected_tag=mc${mc_version}-v${mod_version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: artifact_base=${artifact_base} mod_version=${mod_version} mc_version=${mc_version} tiktoklive=${tiktoklive_version} prerelease=${prerelease}"

      - name: Verify tag matches branch metadata
        if: startsWith(github.ref, 'refs/tags/mc')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="${{ steps.vars.outputs.expected_tag }}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Tag '$tag' does not match expected '$expected'."
            echo "::error::Format is 'mc<minecraftVersion>-v<mod_version>'; check build.gradle minecraftVersion and gradle.properties mod_version match the tag."
            exit 1
          fi

      - name: Verify CHANGELOG entry for release
        if: startsWith(github.ref, 'refs/tags/mc')
        shell: bash
        run: |
          version="${{ steps.vars.outputs.mod_version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing at repo root."
            exit 1
          fi
          if ! awk -v ver="$version" '
            /^##[[:space:]]+/ {
              line = $0
              sub(/^##[[:space:]]+/, "", line)
              sub(/^\[/, "", line)
              n = index(line, "]")
              if (n > 0) {
                line = substr(line, 1, n - 1)
              } else if (match(line, /[[:space:]]/) > 0) {
                line = substr(line, 1, RSTART - 1)
              }
              if (line == ver) { found = 1; exit }
            }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${version}' (or '## [${version}]') section. Add a release note before tagging."
            exit 1
          fi

      - name: Cache TikTokLiveJava jar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: libs
          key: tiktoklive-${{ steps.vars.outputs.tiktoklive_version }}
          restore-keys: |
            tiktoklive-

      - name: Build mod jar and Prism bundle
        run: ./gradlew --no-daemon --stacktrace clean build prismBundle verifyPrismMetadata

      - name: Package Packwiz client bundle zip
        id: packwiz
        shell: bash
        run: |
          bundle_zip="${{ steps.vars.outputs.artifact_base }}-${{ steps.vars.outputs.mc_version }}-${{ steps.vars.outputs.mod_version }}-packwiz.zip"
          (cd build/prism-bundle && zip -r "../../${bundle_zip}" .)
          echo "bundle_zip=${bundle_zip}" >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp build/libs/*.jar release-assets/
          cp "${{ steps.packwiz.outputs.bundle_zip }}" release-assets/
          ls -la release-assets/

      - name: Generate checksums
        shell: bash
        working-directory: release-assets
        run: |
          files=$(find . -maxdepth 1 -type f ! -name 'SHA*SUMS.txt' -printf '%f\n' | sort)
          if [ -z "$files" ]; then
            echo "::error::No assets staged for checksum generation."
            exit 1
          fi
          echo "$files" | xargs -d '\n' sha256sum > SHA256SUMS.txt
          echo "$files" | xargs -d '\n' sha512sum > SHA512SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.vars.outputs.artifact_base }}-${{ steps.vars.outputs.mc_version }}-${{ steps.vars.outputs.mod_version }}
          path: release-assets/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/mc')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ steps.vars.outputs.artifact_base }} v${{ steps.vars.outputs.mod_version }} (MC ${{ steps.vars.outputs.mc_version }})
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
