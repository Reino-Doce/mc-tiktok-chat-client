plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

import java.security.MessageDigest

def getProp = { String name, Object defaultValue = null ->
    if (project.hasProperty(name)) {
        return project.property(name)
    }
    return defaultValue
}

ext {
    minecraftVersion = getProp('minecraft_version', '1.20.1').toString()
    forgeVersion = getProp('forge_version', '47.4.16').toString()
    targetMappingChannel = getProp('mapping_channel', 'official').toString()
    targetMappingVersion = getProp('mapping_version', minecraftVersion).toString()
    javaVersion = Integer.parseInt(getProp('java_version', '17').toString())
    allowUnverifiedTarget = Boolean.parseBoolean(getProp('allow_unverified_target', 'false').toString())
    tiktokLiveVersion = getProp('tiktoklive_version', '1.11.11-Release').toString()
    tiktokLiveJarPath = getProp('tiktoklive_jar_path', "libs/Client-${tiktokLiveVersion}-all.jar").toString()
}

ext.knownTargets = [
        '1.20.1': [forge: '47.4.16', java: 17]
]

if (!minecraftVersion || !forgeVersion || !targetMappingChannel || !targetMappingVersion || !javaVersion) {
    throw new GradleException("Missing required properties. Required: minecraft_version, forge_version, mapping_channel, mapping_version, java_version")
}

if (targetMappingChannel == 'official' && targetMappingVersion != minecraftVersion) {
    throw new GradleException("Invalid mapping configuration: official mappings require mapping_version == minecraft_version (${minecraftVersion}).")
}

def known = knownTargets[minecraftVersion]
if (known != null) {
    if (forgeVersion != known.forge) {
        throw new GradleException("Invalid Forge version for Minecraft ${minecraftVersion}. Expected forge_version=${known.forge}. Override only with -Pallow_unverified_target=true.")
    }
    if (javaVersion != known.java) {
        throw new GradleException("Invalid Java target for Minecraft ${minecraftVersion}. Expected java_version=${known.java}.")
    }
} else if (!allowUnverifiedTarget) {
    throw new GradleException("Target ${minecraftVersion} is not in validated matrix. Use -Pallow_unverified_target=true to bypass.")
}

version = mod_version
group = mod_group_id

base {
    archivesName = artifact_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)

println "Target => MC ${minecraftVersion}, Forge ${forgeVersion}, mappings ${targetMappingChannel}:${targetMappingVersion}, Java ${javaVersion}"
println "Host Java => ${System.getProperty 'java.version'} ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'})"

def tikTokLiveJar = file(tiktokLiveJarPath)
def tikTokLiveReleaseUrl = "https://github.com/jwdeveloper/TikTokLiveJava/releases/download/${tiktokLiveVersion}/Client-${tiktokLiveVersion}-all.jar"
def prismMetadataFile = layout.buildDirectory.file("prism-index/reinodoce-mc-tiktok.pw.toml")
def prismBundleRoot = layout.buildDirectory.dir("prism-bundle")
def prismBundleModsDir = layout.buildDirectory.dir("prism-bundle/mods")
def prismBundleIndexDir = layout.buildDirectory.dir("prism-bundle/mods/.index")

tasks.register('prepareTikTokLiveJar') {
    outputs.file(tikTokLiveJar)
    doLast {
        if (tikTokLiveJar.exists()) {
            return
        }
        tikTokLiveJar.parentFile.mkdirs()
        logger.lifecycle("Downloading TikTokLiveJava from ${tikTokLiveReleaseUrl}")
        new URL(tikTokLiveReleaseUrl).withInputStream { input ->
            tikTokLiveJar.withOutputStream { output ->
                output << input
            }
        }
        if (!tikTokLiveJar.exists()) {
            throw new GradleException("Failed to provision TikTokLiveJava jar at ${tikTokLiveJar}")
        }
    }
}

minecraft {
    mappings channel: targetMappingChannel, version: targetMappingVersion
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"

    implementation files(tikTokLiveJar)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('compileJava').configure {
    dependsOn 'prepareTikTokLiveJar'
}

tasks.named('jar').configure {
    dependsOn 'prepareTikTokLiveJar'
}

tasks.register('prismMetadata') {
    dependsOn 'reobfJar'
    outputs.file(prismMetadataFile)
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("Jar file not found for Prism metadata generation: ${jarFile}")
        }

        byte[] bytes = jarFile.bytes
        String sha512 = MessageDigest.getInstance("SHA-512").digest(bytes).collect { String.format("%02x", it) }.join()
        String jarFileName = jarFile.name

        String content = """name = "${mod_name}"
filename = "${jarFileName}"
side = "client"
x-prismlauncher-loaders = ["forge"]
x-prismlauncher-mc-versions = ["${minecraftVersion}"]
x-prismlauncher-release-type = "release"
x-prismlauncher-version-number = "${mod_version}"
x-prismlauncher-dependencies = []

[download]
mode = "url"
url = "https://local.invalid/${jarFileName}"
hash-format = "sha512"
hash = "${sha512}"

[update.modrinth]
mod-id = "local.${mod_id}"
version = "local-${mod_version}"
"""

        def output = prismMetadataFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(content, 'UTF-8')
    }
}

tasks.register('prismBundle') {
    dependsOn 'prismMetadata'
    outputs.dir(prismBundleRoot)
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def metadataFile = prismMetadataFile.get().asFile

        if (!jarFile.exists()) {
            throw new GradleException("Jar file not found for Prism bundle: ${jarFile}")
        }
        if (!metadataFile.exists()) {
            throw new GradleException("Prism metadata file not found: ${metadataFile}")
        }

        def root = prismBundleRoot.get().asFile
        def mods = prismBundleModsDir.get().asFile
        def index = prismBundleIndexDir.get().asFile

        delete(root)
        mods.mkdirs()
        index.mkdirs()

        copy {
            from jarFile
            into mods
        }
        copy {
            from metadataFile
            into index
        }
    }
}

tasks.register('verifyPrismMetadata') {
    dependsOn 'prismMetadata'
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def metadataFile = prismMetadataFile.get().asFile

        if (!jarFile.exists()) {
            throw new GradleException("Jar file not found for Prism metadata verification: ${jarFile}")
        }
        if (!metadataFile.exists()) {
            throw new GradleException("Prism metadata file not found for verification: ${metadataFile}")
        }

        String metadata = metadataFile.getText('UTF-8')
        if (!metadata.contains('side = "client"')) {
            throw new GradleException("Prism metadata is missing side=client.")
        }

        def filenameMatch = (metadata =~ /(?m)^filename = "([^"]+)"$/)
        if (!filenameMatch.find()) {
            throw new GradleException("Prism metadata is missing filename field.")
        }
        String filename = filenameMatch.group(1)
        if (filename != jarFile.name) {
            throw new GradleException("Prism metadata filename (${filename}) does not match jar name (${jarFile.name}).")
        }

        def hashFormatMatch = (metadata =~ /(?m)^hash-format = "([^"]+)"$/)
        if (!hashFormatMatch.find() || hashFormatMatch.group(1).toLowerCase(Locale.ROOT) != 'sha512') {
            throw new GradleException("Prism metadata hash-format must be sha512.")
        }

        def hashMatch = (metadata =~ /(?m)^hash = "([0-9a-fA-F]+)"$/)
        if (!hashMatch.find()) {
            throw new GradleException("Prism metadata is missing hash field.")
        }
        String metadataHash = hashMatch.group(1).toLowerCase(Locale.ROOT)
        String jarHash = MessageDigest.getInstance("SHA-512").digest(jarFile.bytes).collect { String.format("%02x", it) }.join()
        if (metadataHash != jarHash) {
            throw new GradleException("Prism metadata hash does not match jar SHA-512.")
        }
    }
}

tasks.register('verifyEmbeddedPackages') {
    dependsOn 'jar'
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("Jar file not found for embedded package verification: ${jarFile}")
        }

        def bannedPrefixes = [
                'com/google/gson/',
                'org/slf4j/'
        ]
        def bannedEntries = [
                'META-INF/services/org.slf4j.spi.SLF4JServiceProvider'
        ]

        def foundPrefixes = [] as Set
        def foundEntries = [] as Set
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                bannedPrefixes.each { prefix ->
                    if (entry.name.startsWith(prefix)) {
                        foundPrefixes.add(prefix)
                    }
                }
                if (bannedEntries.contains(entry.name)) {
                    foundEntries.add(entry.name)
                }
            }
        }

        if (!foundPrefixes.isEmpty() || !foundEntries.isEmpty()) {
            def issues = []
            if (!foundPrefixes.isEmpty()) {
                issues.add("package prefixes: ${foundPrefixes.join(', ')}")
            }
            if (!foundEntries.isEmpty()) {
                issues.add("entries: ${foundEntries.join(', ')}")
            }
            throw new GradleException("Embedded jar contains banned content: ${issues.join('; ')}")
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraftVersion,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forgeVersion,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from(zipTree(tikTokLiveJar)) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
        exclude 'com/google/gson/**'
        exclude 'org/slf4j/**'
        exclude 'META-INF/services/org.slf4j.spi.SLF4JServiceProvider'
        exclude 'META-INF/versions/**/module-info.class'
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('check').configure {
    dependsOn 'verifyEmbeddedPackages'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
