plugins {
    id 'java-library'
    id 'maven-publish'
}

def getProp = { String name, Object defaultValue = null ->
    if (project.hasProperty(name)) {
        return project.property(name)
    }
    return defaultValue
}

ext {
    targetJavaVersion = Integer.parseInt(getProp('java_version', '17').toString())
    tikTokLiveVersion = getProp('tiktoklive_version', '1.11.11-Release').toString()
    tikTokLiveJarPath = getProp('tiktoklive_jar_path', "libs/Client-${tikTokLiveVersion}-all.jar").toString()
}

group = getProp('shared_group_id', 'br.com.reinodoce.mctiktok').toString()
version = getProp('shared_version', '0.1.0').toString()

base {
    archivesName = getProp('artifact_base_name', 'reinodoce-mc-tiktok-shared').toString()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
    withJavadocJar()
}

println "Target => Shared Java ${targetJavaVersion}"
println "Host Java => ${System.getProperty 'java.version'} ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'})"

def tikTokLiveJar = file(tikTokLiveJarPath)
def tikTokLiveReleaseUrl = "https://github.com/jwdeveloper/TikTokLiveJava/releases/download/${tikTokLiveVersion}/Client-${tikTokLiveVersion}-all.jar"

repositories {
    mavenCentral()
}

dependencies {
    implementation files(tikTokLiveJar)
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.slf4j:slf4j-api:2.0.13'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.register('prepareTikTokLiveJar') {
    outputs.file(tikTokLiveJar)
    doLast {
        if (tikTokLiveJar.exists()) {
            return
        }
        tikTokLiveJar.parentFile.mkdirs()
        logger.lifecycle("Downloading TikTokLiveJava from ${tikTokLiveReleaseUrl}")
        new URL(tikTokLiveReleaseUrl).withInputStream { input ->
            tikTokLiveJar.withOutputStream { output ->
                output << input
            }
        }
        if (!tikTokLiveJar.exists()) {
            throw new GradleException("Failed to provision TikTokLiveJava jar at ${tikTokLiveJar}")
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn 'prepareTikTokLiveJar'
}

tasks.named('javadoc').configure {
    dependsOn 'prepareTikTokLiveJar'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('verifySharedCore') {
    inputs.files(fileTree('src').matching { include '**/*.java' })
    doLast {
        def disallowedImports = [
                'import net.minecraft',
                'import net.minecraftforge'
        ]

        fileTree('src').matching { include '**/*.java' }.files.each { sourceFile ->
            String text = sourceFile.getText('UTF-8')
            disallowedImports.each { token ->
                if (text.contains(token)) {
                    throw new GradleException("Shared branch contains forbidden import '${token}' in ${sourceFile}")
                }
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn 'verifySharedCore'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('repo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(project.ext.targetJavaVersion as int)
}
